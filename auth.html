{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <h2>{% if mode == 'register' %}Register Account{% else %}Login{% endif %}</h2>
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            {% if mode == 'register' %}
            <div class="form-group">
                <label>University</label>
                <input type="text" name="university" placeholder="e.g. Embry-Riddle" required>
            </div>
            {% endif %}
            <button type="submit" class="btn">{% if mode == 'register' %}Sign Up{% else %}Login{% endif %}</button>
        </form>
        <p class="auth-switch">
            {% if mode == 'register' %}
                Already have an account? <a href="{{ url_for('login') }}">Login here</a>
            {% else %}
                Need an account? <a href="{{ url_for('register') }}">Register here</a>
            {% endif %}
        </p>
    </div>
</div>
{% endblock %}
